# Render Blueprint: web service + PostgreSQL database
services:
  - type: web
    name: conference-review
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webapp.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: conference-review-db
          property: connectionString
databases:
  - name: conference-review-db
    plan: free
