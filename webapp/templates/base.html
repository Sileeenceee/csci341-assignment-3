<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Conference Review Admin{% endblock %}</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#222}
 nav{background:#24324a;padding:10px 16px}
 nav a{color:#fff;margin-right:16px;text-decoration:none;font-weight:600}
 main{padding:16px;max-width:1200px;margin:auto}
 table{border-collapse:collapse;width:100%;background:#fff;margin:8px 0 16px}
 th,td{border:1px solid #ccd;padding:5px 8px;text-align:left;font-size:14px;vertical-align:top}
 th{background:#e8ecf3}
 .flash{padding:8px 12px;margin:8px 0;border-radius:4px}
 .flash.ok{background:#dff3e0;border:1px solid #6b6}
 .flash.error{background:#fde2e2;border:1px solid #d55;font-weight:600}
 form.inline{display:inline}
 label{display:block;margin-top:8px;font-weight:600}
 input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{width:100%;max-width:520px;padding:5px;box-sizing:border-box}
 textarea{height:80px}
 fieldset{background:#fff;border:1px solid #ccd;margin:12px 0;max-width:620px}
 button{padding:5px 12px;cursor:pointer}
 button.danger{background:#c33;color:#fff;border:none}
 .muted{color:#777;font-size:13px}
</style>
</head>
<body>
<nav>
 <a href="{{ url_for('index') }}">Home</a>
 <a href="{{ url_for('users') }}">Users</a>
 <a href="{{ url_for('papers') }}">Papers</a>
 <a href="{{ url_for('reviews') }}">Reviews</a>
 <a href="{{ url_for('sessions') }}">Sessions</a>
 <a href="{{ url_for('schedule') }}">Schedule (view)</a>
 <a href="{{ url_for('conferences') }}">Conferences &amp; tracks</a>
</nav>
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}
 {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
