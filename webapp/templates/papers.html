{% extends "base.html" %}
{% block content %}
<h1>Papers</h1>
<p><a href="{{ url_for('paper_form') }}">+ New paper</a></p>
<table><tr><th>ID</th><th>Title</th><th>Conference</th><th>Track</th><th>Status</th><th>Session</th><th>Corresponding author</th><th></th></tr>
{% for p in rows %}<tr><td>{{ p.paper_id }}</td><td><a href="{{ url_for('paper_detail', pid=p.paper_id) }}">{{ p.title }}</a></td>
<td>{{ p.acronym }}</td><td>{{ p.track }}</td><td>{{ p.status }}</td><td>{{ p.session_id or '' }}</td><td>{{ p.corresponding or '' }}</td>
<td><a href="{{ url_for('paper_form', pid=p.paper_id) }}">edit</a></td></tr>{% endfor %}
</table>
{% endblock %}
